<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-label="Workload account categorized architecture: Expose, NonExpose, Secure">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .tiny { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .account { fill: #ffffff; stroke: #334155; stroke-width: 3; stroke-dasharray: 10 6; }
      .expose { fill: #ffedd5; stroke: #ea580c; stroke-width: 2.5; }
      .nonexpose { fill: #fef3c7; stroke: #ca8a04; stroke-width: 2.5; }
      .secure { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .box-net { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .box-comp { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .box-db { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .box-store { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .flow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrowBlue); }
      .flow-data { stroke: #15803d; stroke-width: 2.5; fill: none; marker-end: url(#arrowGreen); }
      .flow-sec { stroke: #b45309; stroke-width: 2.5; fill: none; marker-end: url(#arrowAmber); stroke-dasharray: 7 5; }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#15803d"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#b45309"/></marker>
  </defs>

  <rect x="0" y="0" width="2560" height="1440" fill="#f1f5f9"/>
  <text x="60" y="62" class="title">Workload Account Architecture — Categorized View</text>
  <text x="60" y="92" class="subtitle">Focus area from snapshot: Expose • NonExpose • Secure (EKS deployment, Angular frontend, Node.js API)</text>

  <rect x="50" y="130" width="2460" height="1240" rx="14" class="account"/>
  <text x="78" y="166" class="section">Workload Account — GIS Application VPC (Multi-AZ)</text>

  <!-- EXPOSE -->
  <rect x="90" y="200" width="2320" height="260" rx="12" class="expose"/>
  <rect x="2250" y="210" width="140" height="38" rx="6" fill="#dc2626"/>
  <text x="2285" y="236" text-anchor="middle" class="label" fill="#ffffff">Expose</text>

  <rect x="130" y="270" width="360" height="90" rx="10" class="box-net"/>
  <text x="160" y="323" class="label">Internet Gateway</text>

  <rect x="530" y="270" width="420" height="90" rx="10" class="box-net"/>
  <text x="650" y="315" class="label">ALB / NLB</text>
  <text x="650" y="336" class="tiny">Public entry with WAF</text>

  <rect x="990" y="270" width="300" height="90" rx="10" class="box-net"/>
  <text x="1065" y="323" class="label">API Gateway</text>

  <rect x="1330" y="270" width="340" height="90" rx="10" class="box-net"/>
  <text x="1410" y="315" class="label">Route 53 Alias</text>
  <text x="1410" y="336" class="tiny">DNS routing to ALB</text>

  <rect x="1710" y="270" width="340" height="90" rx="10" class="box-net"/>
  <text x="1785" y="315" class="label">Angular Frontend</text>
  <text x="1785" y="336" class="tiny">Ingress exposed app</text>

  <!-- NON EXPOSE -->
  <rect x="90" y="490" width="2320" height="380" rx="12" class="nonexpose"/>
  <rect x="2165" y="500" width="225" height="38" rx="6" fill="#f59e0b"/>
  <text x="2277" y="526" text-anchor="middle" class="label" fill="#111827">NonExpose</text>

  <rect x="130" y="560" width="560" height="270" rx="10" class="box-comp"/>
  <text x="150" y="588" class="label">EKS Cluster</text>

  <rect x="160" y="615" width="240" height="80" rx="8" class="box-comp"/>
  <text x="205" y="662" class="label">Node.js API Pods</text>

  <rect x="430" y="615" width="230" height="80" rx="8" class="box-comp"/>
  <text x="470" y="662" class="label">Angular Pods</text>

  <rect x="160" y="715" width="500" height="80" rx="8" class="box-comp"/>
  <text x="300" y="762" class="label">Service Mesh / Internal Services</text>

  <rect x="730" y="560" width="350" height="270" rx="10" class="box-comp"/>
  <text x="760" y="588" class="label">ECS Cluster (optional)</text>
  <rect x="760" y="635" width="290" height="160" rx="8" class="box-comp"/>
  <text x="810" y="722" class="label">Container Workloads</text>

  <rect x="1120" y="560" width="420" height="270" rx="10" class="box-comp"/>
  <text x="1150" y="588" class="label">Private API Tier</text>
  <rect x="1150" y="635" width="360" height="160" rx="8" class="box-comp"/>
  <text x="1245" y="722" class="label">Node.js API Services</text>

  <!-- SECURE -->
  <rect x="90" y="900" width="2320" height="430" rx="12" class="secure"/>
  <rect x="2258" y="910" width="132" height="38" rx="6" fill="#16a34a"/>
  <text x="2324" y="936" text-anchor="middle" class="label" fill="#ffffff">Secure</text>

  <rect x="130" y="970" width="360" height="120" rx="10" class="box-store"/>
  <text x="165" y="1038" class="label">ElastiCache / Memcached</text>

  <rect x="530" y="970" width="420" height="120" rx="10" class="box-db"/>
  <text x="620" y="1030" class="label">RDS Database (Multi-AZ)</text>
  <text x="620" y="1052" class="tiny">PostgreSQL / PostGIS</text>

  <rect x="990" y="970" width="330" height="120" rx="10" class="box-db"/>
  <text x="1065" y="1038" class="label">DocumentDB</text>

  <rect x="1360" y="970" width="400" height="120" rx="10" class="box-db"/>
  <text x="1445" y="1038" class="label">OpenSearch Service</text>

  <rect x="1800" y="970" width="280" height="120" rx="10" class="box-store"/>
  <text x="1880" y="1038" class="label">S3 Geospatial Data</text>

  <rect x="130" y="1120" width="360" height="120" rx="10" class="box-store"/>
  <text x="235" y="1188" class="label">EBS Volumes</text>

  <rect x="530" y="1120" width="360" height="120" rx="10" class="box-comp"/>
  <text x="640" y="1188" class="label">Amazon ECR</text>

  <!-- Flows -->
  <path class="flow" d="M 490 315 L 530 315"/>
  <path class="flow" d="M 950 315 L 990 315"/>
  <path class="flow" d="M 1290 315 L 1330 315"/>
  <path class="flow" d="M 1670 315 L 1710 315"/>

  <path class="flow" d="M 740 360 L 740 560 L 420 560 L 420 615"/>
  <path class="flow" d="M 740 360 L 740 560 L 1330 560 L 1330 635"/>

  <path class="flow" d="M 1080 315 L 1080 560 L 1330 560 L 1330 635"/>

  <path class="flow-data" d="M 1330 795 L 1330 930 L 740 930 L 740 970"/>
  <path class="flow-data" d="M 1330 795 L 1330 930 L 310 930 L 310 970"/>
  <path class="flow-data" d="M 1330 795 L 1330 930 L 1155 930 L 1155 970"/>
  <path class="flow-data" d="M 1330 795 L 1330 930 L 1560 930 L 1560 970"/>
  <path class="flow-data" d="M 1330 795 L 1330 930 L 1940 930 L 1940 970"/>

  <path class="flow-data" d="M 420 795 L 420 1120 L 310 1120"/>
  <path class="flow-data" d="M 420 795 L 420 1120 L 640 1120"/>

  <path class="flow-sec" d="M 2100 1030 L 2200 1030"/>

  <!-- Legend -->
  <rect x="2150" y="970" width="230" height="270" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="2170" y="998" class="label">Legend</text>
  <line x1="2170" y1="1020" x2="2270" y2="1020" class="flow"/><text x="2280" y="1025" class="tiny">API/App traffic</text>
  <line x1="2170" y1="1050" x2="2270" y2="1050" class="flow-data"/><text x="2280" y="1055" class="tiny">Data flow</text>
  <line x1="2170" y1="1080" x2="2270" y2="1080" class="flow-sec"/><text x="2280" y="1085" class="tiny">Secure controls/logs</text>
  <rect x="2170" y="1100" width="26" height="20" class="expose"/><text x="2205" y="1115" class="tiny">Expose</text>
  <rect x="2170" y="1130" width="26" height="20" class="nonexpose"/><text x="2205" y="1145" class="tiny">NonExpose</text>
  <rect x="2170" y="1160" width="26" height="20" class="secure"/><text x="2205" y="1175" class="tiny">Secure</text>
</svg>
